services:
  db:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - dev-mongo-database:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  dev-mongo-database:
